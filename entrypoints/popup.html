<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photos Sponge</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        color: #172026;
        font: 13px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 16px;
      }

      p {
        margin: 0 0 10px;
      }

      kbd {
        min-width: 18px;
        padding: 2px 6px;
        border: 1px solid #cbd5dc;
        border-bottom-width: 2px;
        border-radius: 4px;
        background: #f8fafc;
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <h1>Photos Sponge</h1>
    <p>Open Google Photos, scroll to the month you want to clean, then use the floating panel.</p>
    <p><kbd>Y</kbd> keeps the current photo. <kbd>N</kbd> marks it for trash. Nothing is deleted until you confirm.</p>
  </body>
</html>
